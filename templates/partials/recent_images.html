{% if images %}
    {% for image in images %}
    <div class="image-card" id="image-{{ image.id }}">
        <img src="/images/{{ image.filename }}"
             alt="{{ image.original_prompt or image.prompt }}"
             data-prompt="{{ image.prompt | e }}"
             data-original-prompt="{{ image.original_prompt | e if image.original_prompt else '' }}"
             onclick="openModalFromElement(this)"
             loading="lazy">
        <div class="info">
            <p title="{{ image.original_prompt or image.prompt }}">{{ image.original_prompt or image.prompt }}</p>
        </div>
        <button class="delete-btn" onclick="deleteImage('{{ image.id }}', event)">Delete</button>
    </div>
    {% endfor %}
{% else %}
    <p class="empty-state">No images generated yet</p>
{% endif %}
