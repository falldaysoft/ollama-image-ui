{% if images %}
    {% for image in images %}
    <div class="image-card" id="image-{{ image.id }}" title="{{ image.original_prompt or image.prompt }}">
        <img src="/images/{{ image.filename }}"
             alt="{{ image.original_prompt or image.prompt }}"
             data-prompt="{{ image.prompt | e }}"
             data-original-prompt="{{ image.original_prompt | e if image.original_prompt else '' }}"
             data-model="{{ image.model | e }}"
             data-width="{{ image.width if image.width else '' }}"
             data-height="{{ image.height if image.height else '' }}"
             onclick="openModalFromElement(this)"
             loading="lazy">
    </div>
    {% endfor %}
{% else %}
    <p class="empty-state">No images generated yet</p>
{% endif %}
