{% extends "base.html" %}

{% block left_panel %}
<section class="generate-form">
    <h2>Generate Image</h2>
    <form id="generateForm" onsubmit="submitGeneration(event)">
        <label for="prompt">
            Prompt
            <textarea id="prompt" name="prompt" placeholder="Describe the image you want to generate..." required></textarea>
        </label>
        <label for="model">
            Model
            <select id="model" name="model">
                {% for model in models %}
                <option value="{{ model.id }}">{{ model.name }}</option>
                {% endfor %}
            </select>
        </label>
        <label for="varyMode">
            Vary Prompt
            <select id="varyMode" name="vary_mode">
                <option value="">None</option>
                <option value="expand">Expand</option>
                <option value="expand_concise">Expand + Sentence</option>
                <option value="expand_keywords">Expand + Keywords</option>
            </select>
        </label>
        <label for="count">
            Count
            <input type="number" id="count" name="count" value="1" min="1" max="100">
        </label>
        <button type="submit" id="generateBtn">Generate</button>
    </form>
</section>
{% endblock %}

{% block center_panel %}
{% endblock %}
