<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ollama Image Generator{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/sse.js"></script>
    <style>
        :root {
            --pico-font-size: 16px;
        }

        .container {
            max-width: 1200px;
            padding: 1rem 2rem;
        }

        nav {
            margin-bottom: 2rem;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .image-card {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: var(--pico-card-background-color);
            border: 1px solid var(--pico-muted-border-color);
        }

        .image-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        .image-card .info {
            padding: 0.5rem;
            font-size: 0.85rem;
        }

        .image-card .info p {
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .image-card .delete-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .image-card:hover .delete-btn {
            opacity: 1;
        }

        .queue-section {
            margin-bottom: 2rem;
        }

        .queue-item {
            display: flex;
            flex-direction: column;
            padding: 0.75rem;
            background: var(--pico-card-background-color);
            border: 1px solid var(--pico-muted-border-color);
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }

        .queue-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .queue-item .prompt {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 1rem;
        }

        .queue-item .status {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: var(--pico-muted-border-color);
            border-radius: 4px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #007bff, #00bfff);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-status {
            font-size: 0.75rem;
            color: var(--pico-muted-color);
            margin-top: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-pending { background: #ffd700; color: #333; }
        .status-processing { background: #007bff; color: white; }
        .status-completed { background: #28a745; color: white; }
        .status-failed { background: #dc3545; color: white; }

        .generate-form {
            margin-bottom: 2rem;
        }

        .generate-form textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }

        .form-row > * {
            flex: 1;
        }

        .form-row button {
            flex: 0 0 auto;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .modal .close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--pico-muted-color);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .processing-indicator {
            animation: pulse 1.5s ease-in-out infinite;
        }

        .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            margin-bottom: 1rem;
            width: auto;
        }

        .checkbox-label input[type="checkbox"] {
            width: 1.2rem;
            height: 1.2rem;
            margin: 0;
            flex-shrink: 0;
        }

        .vary-badge {
            background: #9b59b6;
            color: white;
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            margin-right: 0.5rem;
        }

        .varied-prompt {
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: rgba(155, 89, 182, 0.1);
            border-left: 3px solid #9b59b6;
            border-radius: 0 4px 4px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .varied-prompt small {
            color: var(--pico-muted-color);
        }
    </style>
</head>
<body>
    <nav class="container">
        <ul>
            <li><strong>Ollama Image Generator</strong></li>
        </ul>
        <ul>
            <li><a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Generate</a></li>
            <li><a href="/gallery" {% if request.url.path == '/gallery' %}aria-current="page"{% endif %}>Gallery</a></li>
        </ul>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Image Modal -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img id="modalImage" src="" alt="Full size image">
    </div>

    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
